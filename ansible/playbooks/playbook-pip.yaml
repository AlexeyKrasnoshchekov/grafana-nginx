- name: Ensure pip is installed
  hosts: client2
  become: true
  tasks:
    - name: Install python3-pip package
      apt:
        name: python3-pip
        state: present
      when: ansible_facts['pkg_mgr'] == 'apt'

    - name: Install python-pip package for older python
      apt:
        name: python-pip
        state: present
      when: ansible_facts['pkg_mgr'] == 'apt' and ansible_distribution_major_version|int < 20

    - name: Install python3-pip on CentOS/RHEL
      yum:
        name: python3-pip
        state: present
      when: ansible_facts['pkg_mgr'] == 'yum'

    - name: Check pip is installed
      command: pip3 --version
      register: pip_check
      ignore_errors: yes

    - name: Install pip with get-pip.py script if missing
      block:
        - get_url:
            url: https://bootstrap.pypa.io/get-pip.py
            dest: /tmp/get-pip.py
        - command: python3 /tmp/get-pip.py
      when: pip_check.failed
